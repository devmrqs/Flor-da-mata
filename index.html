<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Flor da Mata — Distribuidora de Produtos Naturais</title>
  <meta
    name="description"
    content="Distribuidora de produtos naturais desde 2006. Mais de 100 produtos em 10 categorias — chás, grãos, sementes e suplementos — para lojistas de todo o Brasil."
  />
  <meta name="theme-color" content="#5D673C" />

  <!-- prévia ao compartilhar link (WhatsApp, LinkedIn, Slack) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Flor da Mata" />
  <meta property="og:url" content="https://flordamata.vercel.app/" />
  <meta
    property="og:title"
    content="Flor da Mata — Distribuidora de Produtos Naturais"
  />
  <meta
    property="og:description"
    content="Mais de 100 produtos naturais em 10 categorias, direto da natureza para a sua loja."
  />
  <!-- URL absoluta é exigência do protocolo: quem lê a tag é o WhatsApp,
       não o navegador, e ele não tem como resolver caminho relativo -->
  <meta
    property="og:image"
    content="https://flordamata.vercel.app/og-image.png"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Logotipo da Flor da Mata" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:image"
    content="https://flordamata.vercel.app/og-image.png"
  />

  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
